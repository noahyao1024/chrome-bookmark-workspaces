name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 build.py
      - run: npm test
      - run: python3 native-bridge/host_test.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_public.py

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 build.py
      - run: python3 build_launcher.py --universal
      - run: python3 launcher.test.py
      - run: python3 native-launcher.test.py
      - run: python3 timing/wire_test.py
      - run: swiftc timing/TimingCore.swift timing/TimingCoreTests.swift -o .build/timing-tests && .build/timing-tests
      - run: python3 timing/install.py --build-only
      - run: python3 scripts/package.py --skip-build
      - run: python3 scripts/check_public.py --artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-packages
          path: |
            dist/*.zip
            dist/*.alfredworkflow
