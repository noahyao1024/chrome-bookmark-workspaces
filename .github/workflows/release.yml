name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c 'import os,json; assert os.environ["RELEASE_TAG"] == "v"+json.load(open("package.json"))["version"]'
      - run: python3 build.py
      - run: npm test
      - run: python3 native-bridge/host_test.py
      - run: python3 -m unittest discover -s tests
      - run: python3 build_launcher.py --universal
      - run: python3 launcher.test.py
      - run: python3 native-launcher.test.py
      - run: python3 timing/wire_test.py
      - run: python3 scripts/package.py --skip-build
      - run: python3 scripts/check_public.py --artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.alfredworkflow --verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes.md
